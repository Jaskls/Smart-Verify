# Smart-Verify is a plain static site (HTML + CSS + vanilla JS).
# No build step: Netlify publishes the project folder as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
